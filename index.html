<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrismWeave</title>
    <link rel="stylesheet" href="index.css">

    <!--Google Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
</head>
<body>
    <div class="split-container">

        <div class="left-content">
            <div>
            <h1 class="title"><ins>PrismWeave</ins></h1>
            <h3>Fabric · Textile · Sewing</h3>
            </div>

            <div>
                <h1 class="text">Everything you <br>
                need to <em>make</em><br>
                something<br>
                beautiful.</h1>
                <p>Browse fabrics, threads, buttons, zippers, needles, ribbons, and<br>
                sewing tools in one simple store.</p>
            </div>

            <div>
            <a href="catalog.html" class="browse">Shop supplies →</a>
            </div>
        </div>

        <div class="right-images">
            <img src="images/spool.png" class="thread" alt="Thread">
            <img src="images/star_button.png" class="star">
            <img src="images/circle_button.png" class="circle">
            <img src="images/clover_button.png" class="clover">
        </div>
    </div>
